name: deepcirc-interp
channels:
  - conda-forge
  - pytorch
dependencies:
  - python>=3.10,<3.13
  - pip
  # Core numerics
  - numpy>=1.26,<3
  - pandas>=2.0,<3
  - scipy>=1.11,<2
  # I/O
  - h5py>=3.10,<4
  - pyyaml>=6.0,<7
  - pyarrow>=14
  # Graphs
  - networkx>=3.1,<4
  # Plotting
  - matplotlib>=3.8,<4
  - pillow>=10.0
  # ML (CPU-only for analysis; reviewers running Path 2 / training need GPU torch)
  - pytorch>=2.0
  - scikit-learn>=1.3,<2
  # Optional vector/raster tooling for the figure pipeline
  - cairo
  - pip:
      - svgwrite>=1.4,<2
      - cairosvg>=2.7
      - scienceplots>=2.1
