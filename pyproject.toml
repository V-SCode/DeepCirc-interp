[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepcirc-interp"
version = "0.1.0"
description = "Interpretability companion code for DeepCirc supplementary figures S10-S15."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Venkat Vege" },
]
keywords = ["synthetic-biology", "interpretability", "deep-learning", "circuits", "mechanistic-interpretability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# Runtime dependencies are listed in requirements.txt to keep the laptop-
# install path explicit; install with `pip install -e .` then
# `pip install -r requirements.txt`.

[tool.setuptools.packages.find]
where = ["."]
include = ["topology*", "interp*", "figures*"]
exclude = [
    "*.panels",
    "*.final",
    "*.preview",
    "*._spec",
    "tests*",
    "data*",
    "upstream*",
    "docs*",
]

[tool.setuptools.package-data]
"topology.configs" = ["*.yaml"]
"figures.styles" = ["*.mplstyle"]
"figures.setFinal" = ["**/manifest*.yaml"]
