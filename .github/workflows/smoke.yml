name: smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: build all S10–S15 figures (Tier 0 only)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          # The CI smoke test only exercises the Tier 0 figure-rebuild path,
          # which does not need the upstream DeepCirc submodule. The submodule
          # is only required for back-end re-runs (PPO+GAT topology generation,
          # MLP training, simulator-valued Shapley-Taylor). Skipping the clone
          # here also lets CI run before the upstream DeepCirc repo is public.
          submodules: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Microsoft core fonts (Arial, etc.) + clear matplotlib cache
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" \
            | sudo debconf-set-selections
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ttf-mscorefonts-installer fonts-liberation
          sudo fc-cache -fv > /dev/null
          # Verify Arial is now findable
          fc-list | grep -i "Arial" | head -3 || (echo "Arial NOT installed"; exit 1)
          # Clear matplotlib's font cache so the next run picks up the new fonts
          rm -rf ~/.cache/matplotlib

      - name: Install pip dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Build v1.0 setFinal figures (6 figures, S10–S15)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: make figures

      - name: Build v1.1 setFinalvF figures (2 figures, S10 + S11)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: make figures-vf

      - name: Build v1.1 setFinalvF supplementary tables (3 tables, S1–S3)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: make tables-vf

      - name: Verify each setFinal PDF exists and is non-trivial
        run: |
          for fig in S10 S11 S12 S13 S14 S15; do
            pdf="figures/setFinal/fig${fig}/final/figure_${fig}.pdf"
            if [ ! -f "$pdf" ]; then
              echo "MISSING: $pdf"
              exit 1
            fi
            size=$(stat -c%s "$pdf" 2>/dev/null || stat -f%z "$pdf")
            if [ "$size" -lt 100000 ]; then
              echo "TOO SMALL: $pdf ($size bytes; expected >100KB)"
              exit 1
            fi
            echo "  OK  $pdf  ($size bytes)"
          done

      - name: Verify each setFinalvF PDF + table PDF exists and is non-trivial
        run: |
          for fig in S10 S11; do
            pdf="figures/setFinalvF/fig${fig}/final/figure_${fig}.pdf"
            if [ ! -f "$pdf" ]; then
              echo "MISSING: $pdf"
              exit 1
            fi
            size=$(stat -c%s "$pdf" 2>/dev/null || stat -f%z "$pdf")
            if [ "$size" -lt 100000 ]; then
              echo "TOO SMALL: $pdf ($size bytes; expected >100KB)"
              exit 1
            fi
            echo "  OK  $pdf  ($size bytes)"
          done
          for n in 1 2 3; do
            pdf="figures/setFinalvF/tabS0${n}/final/table_S${n}.pdf"
            if [ ! -f "$pdf" ]; then
              echo "MISSING: $pdf"
              exit 1
            fi
            size=$(stat -c%s "$pdf" 2>/dev/null || stat -f%z "$pdf")
            if [ "$size" -lt 10000 ]; then
              echo "TOO SMALL: $pdf ($size bytes; expected >10KB)"
              exit 1
            fi
            echo "  OK  $pdf  ($size bytes)"
          done

      - name: Upload composed figures + tables as artifacts
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: figures-S10-S15-and-setFinalvF
          path: |
            figures/setFinal/fig*/final/figure_*.pdf
            figures/setFinalvF/fig*/final/figure_*.pdf
            figures/setFinalvF/tabS0*/final/table_*.pdf
          retention-days: 30
