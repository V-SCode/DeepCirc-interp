name: smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: build all S10–S15 figures (Tier 0 only)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install pip dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Build all six supplementary figures
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: make figures

      - name: Verify each composed PDF exists and is non-trivial
        run: |
          for fig in S10 S11 S12 S13 S14 S15; do
            pdf="figures/setFinal/fig${fig}/final/figure_${fig}.pdf"
            if [ ! -f "$pdf" ]; then
              echo "MISSING: $pdf"
              exit 1
            fi
            size=$(stat -c%s "$pdf" 2>/dev/null || stat -f%z "$pdf")
            if [ "$size" -lt 100000 ]; then
              echo "TOO SMALL: $pdf ($size bytes; expected >100KB)"
              exit 1
            fi
            echo "  OK  $pdf  ($size bytes)"
          done

      - name: Upload composed figures as artifacts
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: figures-S10-S15
          path: figures/setFinal/fig*/final/figure_*.pdf
          retention-days: 30
