# Figure S11: single-slot replacement contributions and pairwise interactions.
# a: per-design fractional replacement contributions for 30 target entries,
#    with circuit above growth. Active builder: build_panel_d_stacked.py.
# b: simulator-valued pairwise Shapley interaction-index heatmaps for Fig. 3
#    yellow-dot designs, on raw circuit and growth scores. Adjacent stripes
#    show conventional Shapley values, not diagonal pair interactions.
# On-disk filenames remain panel_d.pdf / panel_e.pdf; labels are a / b.
# Publication layout checked 2026-10-11: original cropped vector artwork
# is centered without scaling on 360 x 210 / 360 x 260 mm prepared pages.
# Original vector PDFs and their typography remain unchanged. The 20 pt
# specification applies to the figure labels only, not all plot text.
# Run figures/illustrator/prepare_vf_publication.py before assembly.
# Dedicated padded PNG previews avoid stretching the original cropped PNGs.
# Existing final/figure_S11.* files are legacy previews until rebuilt.

figure_id: figure_S11
canvas:
  width_mm: 370.0
  height_mm: 490.0

panels:
  - id: a
    file: ../publication/panels/figS11/panel_d.pdf
    preview_file: ../publication/panels/figS11/panel_d.png
    x_mm: 5.0
    y_mm: 5.0
    w_mm: 360.0
    h_mm: 210.0
    label: {text: a, x_offset_mm: -2.5, y_offset_mm: -2.0, size_pt: 20}

  - id: b
    file: ../publication/panels/figS11/panel_e.pdf
