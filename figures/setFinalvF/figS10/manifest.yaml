# Figure S10 (setFinalvF): design-space, structural motifs, and per-part landscapes.
# Source mapping: old S10 b/c/d -> a/b/c; old S14 a/b -> d/e.
# Publication layout updated 2026-10-11: 240 x 296 mm, all artwork at 100%.
# a/b/c use exact native PDF dimensions. d/e retain their existing cropped
# artwork, centered without scaling on prepared 115 x 105 mm pages.
# Run figures/illustrator/prepare_vf_publication.py before assembly.
# Original vector PDFs are unchanged. Dedicated padded PNG previews must be
# used for d/e; the original cropped PNGs would stretch in these slots.
# Existing final/figure_S10.* files are legacy previews until rebuilt.

